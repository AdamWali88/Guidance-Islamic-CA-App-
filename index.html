function importStudentListFile(){const c=currentClass();if(!c){toast('Select a class first.');return}const input=document.getElementById('studentImportFile'),f=input&&input.files&&input.files[0];if(!f){toast('Choose a student list file first.');return}const processRows=rows=>{if(!rows||!rows.length){toast('No student rows found in this file.');return}let header=rows[0].map(v=>String(v??'').trim().toLowerCase());const idx=(terms)=>header.findIndex(h=>terms.some(t=>h===t||h.includes(t)));let ni=idx(['student name','name','full name','الاسم']),gi=idx(['gender','sex','الجنس']),ai=idx(['admission number','admission no','admission','adm no','رقم القيد']);let data=rows;if(ni<0){ni=0;gi=1;ai=2}else data=rows.slice(1);let added=0,duplicates=0,empty=0;const names=new Set(classStudents().map(x=>String(x.name||'').trim().toLowerCase()));const admissions=new Set(classStudents().map(x=>String(x.admission||'').trim().toLowerCase()).filter(Boolean));for(const row of data){const name=String(row[ni]??'').trim();const gender=String(row[gi]??'').trim();const admission=String(row[ai]??'').trim();if(!name){empty++;continue}const nk=name.toLowerCase(),ak=admission.toLowerCase();if(names.has(nk)||(ak&&admissions.has(ak))){duplicates++;continue}db.students.push({id:uid(),classId:c.id,name,gender:gender?(/^(f|female|girl|أنثى)$/i.test(gender)?'Female':/^(m|male|boy|ذكر)$/i.test(gender)?'Male':gender):'',admission});names.add(nk);if(ak)admissions.add(ak);added++}save();render();toast(`Imported ${added}; duplicates skipped ${duplicates}; empty names skipped ${empty}.`)};const ext=f.name.toLowerCase().split('.').pop();if(ext==='xlsx'||ext==='xls'){if(typeof XLSX==='undefined'){toast('Excel import library is not available. Please save the file as CSV and import again.');return}const r=new FileReader();r.onload=()=>{try{const wb=XLSX.read(r.result,{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];processRows(XLSX.utils.sheet_to_json(ws,{header:1,defval:''}))}catch(e){toast('Could not read this Excel file. Try CSV.')}};r.readAsArrayBuffer(f)}else{const r=new FileReader();r.onload=()=>{const text=r.result.replace(/^\uFEFF/,'');const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const ch=text[i];if(ch==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(ch===','&&!quoted){row.push(cell.trim());cell=''}else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell.trim());if(row.some(v=>v!==''))rows.push(row);row=[];cell=''}else cell+=ch}row.push(cell.trim());if(row.some(v=>v!==''))rows.push(row);processRows(rows)};r.readAsText(f)}}

function sameKey(a,b){return String(a||'').trim().toLowerCase()===String(b||'').trim().toLowerCase()}
function finalScoreKey(className,subject,session,term,studentId){return [className,subject,session,term,studentId].map(v=>String(v??'').trim().toLowerCase()).join('::')}
function cumulativeCA(subject,className){
  const selected=db.assessments.filter(a=>
    (!subject || sameKey(a.subject,subject)) &&
    (!className || sameKey(a.className,className))
  );
  const totals={};
  db.students.forEach(s=>{
    let earned=0,max=0;
    selected.forEach(a=>{earned+=Number(a.scores?.[s.id]||0);max+=Number(a.maxMark||0)});
    const caMax=Math.max(1,Number(db.caMaxMark)||30);totals[s.id]={earned,max,ca40:max?Math.min(caMax,(earned/max)*caMax):0};
  });
  return {selected,totals};
}
function normalizeAssessmentQuestionSet(a){
  if(!a.questions || !a.questions.length) return;
  const exists=db.questionSets.some(q=>q.sourceAssessmentId===a.id);
  if(!exists){
    db.questionSets.push({
      id:'qs_'+a.id,
      sourceAssessmentId:a.id,
      source:'Assessment',
      date:a.date,
      subject:a.subject,
      className:a.className,
      questions:a.questions
    });
  }
}

function csvCell(value){const v=String(value??'');return '"'+v.replace(/"/g,'""')+'"'}
function downloadCsvFile(rows,filename){const csv='\uFEFF'+rows.map(row=>row.map(csvCell).join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function chooseCsvFilename(defaultName){const answer=prompt('Enter a filename for the CSV file (without .csv if you prefer):',defaultName);if(answer===null)return null;let name=answer.trim().replace(/[\\/:*?"<>|]/g,'_').replace(/\.csv$/i,'').trim();if(!name)name=defaultName.replace(/\.csv$/i,'');return name+'.csv';}

function exportCompletedScoreCSV(){
 const ctx=window.activeResultContext;if(!ctx||!ctx.subject||!ctx.className)return toast('Open the live result sheet for a subject first.');
 // Read the live values as typed; convert Arabic/Persian numerals without changing the entered score.
 const examInputs={};document.querySelectorAll('.exam-score').forEach(inp=>{examInputs[String(inp.dataset.student)]=String(inp.value??'').trim()});
 const allStudents=(ctx.students||[]).slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),undefined,{sensitivity:'base'}));
 const rows=[['Student Name','Admission Number','CA','Exam']];
 allStudents.forEach(st=>{const ca=Number(ctx.caById?.[st.id]||0);const raw=examInputs[String(st.id)]??'';const parsed=raw===''?null:Number(guidanceToLatin(raw));const mx=Number(db.examMaxMark||70);const exam=raw===''?'':(Number.isFinite(parsed)?Math.max(0,Math.min(mx,parsed)):'');rows.push([st.name,st.admission||st.adm||'',ca.toFixed(1),exam]);});
 const schoolPart=safeFilePart(db.school||'The_Guidance_International_School');
 const filename=`${schoolPart}_${safeFilePart(ctx.className)}_${safeFilePart(ctx.subject)}_${safeFilePart(ctx.term)}_${safeFilePart(ctx.session)}_CA_Scores.csv`;
 const chosenFilename=chooseCsvFilename(filename);if(!chosenFilename)return;
 downloadCsvFile(rows,chosenFilename);toast('Completed subject scores exported as CSV for the form teacher.');
}

function grade(n){n=Number(n)||0;return n>=70?'A':n>=60?'B':n>=50?'C':n>=45?'D':n>=40?'E':'F'}
function showScoreEditor(a,editingIndex=null){
 sortStudents();
 /* Editing always uses the class saved with the assessment. The score field itself is the saved value. */
 const students=editingIndex!==null && a.classId ? db.students.filter(st=>st.classId===a.classId).sort((x,y)=>x.name.localeCompare(y.name)) : classStudents();
 const isEditing=editingIndex!==null;
 const savedScores=(a&&a.scores&&typeof a.scores==='object')?a.scores:{};
 /* Build fallbacks by student name as well as ID. This keeps old saved records editable even if a student ID was normalized. */
 const scoreByName={};
 Object.keys(savedScores).forEach(k=>{ const st=db.students.find(s=>String(s.id)===String(k)); if(st) scoreByName[String(st.name).trim().toLowerCase()]=savedScores[k]; });
 const rows=students.map((st,i)=>{
   let raw;
   if(Object.prototype.hasOwnProperty.call(savedScores,st.id)) raw=savedScores[st.id];
   else if(Object.prototype.hasOwnProperty.call(savedScores,String(st.id))) raw=savedScores[String(st.id)];

function teacherSignupPage(){

 const isAdmin=currentUser.role==='admin';
 const rows=db.accounts.map((a,i)=>{const canManage=isAdmin||a.role==='teacher';const expired=accountExpired(a),active=a.active!==false&&!expired;const status=expired?'Expired':active?'Active':'Inactive';const actions=canManage?`<button class="secondary small" onclick="toggleTeacherAccount('${esc(a.id)}')">${active?'Deactivate':'Activate'}</button> <button class="danger small" onclick="deleteTeacherAccount('${esc(a.id)}')">Delete</button>`:'<span class="small" style="color:var(--muted)">Managed by Administrator</span>';return `<tr><td>${i+1}</td><td><b>${esc(a.displayName||a.username)}</b></td><td>${esc(a.username)}</td><td>${esc(roleLabel(a.role||'teacher'))}</td><td><span class="status-pill">${status}</span></td><td>${esc(a.expiryDate||'No expiry')}</td><td>${actions}</td></tr>`;}).join('');

function deleteClassProfile(id){
 const c=db.classes.find(x=>String(x.id)===String(id));if(!c)return toast('Class profile not found.');
 const label=classLabel(c);const n=db.students.filter(x=>String(x.classId)===String(id)).length;const a=db.assessments.filter(x=>String(x.classId)===String(id)||sameKey(x.className,label)).length;
 if(!confirm(`Delete class profile "${label}"? This will also delete its ${n} student record(s), ${a} assessment(s), related question sets, examination records and saved final scores. Export a backup first if you need to keep these records.`))return;
 const studentIds=new Set(db.students.filter(x=>String(x.classId)===String(id)).map(x=>String(x.id)));
 db.students=db.students.filter(x=>String(x.classId)!==String(id));
 db.assessments=db.assessments.filter(x=>String(x.classId)!==String(id)&&!sameKey(x.className,label));
 db.questionSets=(db.questionSets||[]).filter(x=>String(x.classId||'')!==String(id)&&!sameKey(x.className,label));
 db.exams=(db.exams||[]).filter(x=>String(x.classId||'')!==String(id)&&!sameKey(x.className,label));
 Object.keys(db.finalScores||{}).forEach(k=>{if(k.toLowerCase().startsWith(label.toLowerCase()+'::')||[...studentIds].some(sid=>k.toLowerCase().endsWith('::'+sid.toLowerCase())))delete db.finalScores[k];});
 db.classes=db.classes.filter(x=>String(x.id)!==String(id));if(String(db.currentClassId)===String(id))db.currentClassId=db.classes[0]?.id||'';
 save();render();toast('Class profile and its linked records deleted.');
}
function settingsPage(){
 const classRows=db.classes.map((c,i)=>`<tr><td>${i+1}</td><td><b>${esc(classLabel(c))}</b></td><td>${esc(c.session||'')}</td><td>${esc(c.term||'')}</td><td>${c.id===db.currentClassId?'Current':'—'}</td><td><button class="danger small" onclick="deleteClassProfile('${c.id}')">Delete Class</button></td></tr>`).join('');
 return `<div class="card" style="margin-bottom:15px"><div class="section-title"><h3 style="margin:0;color:var(--navy)">Class Profiles</h3><button class="primary" onclick="openClassModal()">+ Add Class</button></div><div class="notice">Create a separate class profile for every class you teach. Student names, assessments and results are kept separate by class.</div><div class="table-wrap"><table class="table"><thead><tr><th>S/N</th><th>الصف</th><th>العام الدراسي</th><th>الفصل الدراسي</th><th>Status</th><th>Manage</th></tr></thead><tbody>${classRows||`<tr><td colspan="6" class="empty">No class profiles created yet.</td></tr>`}</tbody></table></div></div><div class="kpi-grid"><div class="card"><div style="margin-bottom:12px"><button class="back-btn" onclick="showPage('dashboard')">← Return</button></div><h3 style="margin-top:0;color:var(--navy)">المدرسة والعرض</h3><div class="field"><label>اسم المدرسة (ثابت)</label><input id="setSchool" value="مدرسة الهدى العالية" readonly disabled aria-readonly="true" title="School name is fixed for this app."></div><div class="field"><label>عنوان التطبيق</label><input id="setTitle" value="${esc(db.title)}"></div><div class="field"><label>الميسّر / المعلّم</label><input id="setFac" value="${esc(db.facilitator)}"></div><div class="field"><label>العام الدراسي</label><input id="setSession" value="${esc(db.session)}" placeholder="e.g. 2026/2027"></div><div class="field"><label>الفصل الدراسي</label><input id="setTerm" value="${esc(db.term)}" placeholder="e.g. First Term"></div><div class="row"><div class="field"><label>Continuous Assessment Maximum</label><input value="30 marks" readonly></div><div class="field"><label>Terminal Examination Maximum</label><input value="70 marks" readonly></div></div><div class="notice">The school scoring scheme is fixed at CA /30 + Examination /70 = Total /100. Manual score entry is limited to the relevant maximum.</div><button class="primary" onclick="saveSettings()">Save Display Settings</button></div>
 <div class="card"><h3 style="margin-top:0;color:var(--navy)">School Logo</h3><img src="${logoSrc()}" style="width:100px;height:100px;border-radius:50%;object-fit:cover;border:4px solid #edf2f6"><p class="small" style="color:var(--muted)">شعار أكاديمية ديمة مضمّن في التطبيق ويعمل دون اتصال بالإنترنت. لا يحتاج المعلمون إلى رفع الشعار.</p></div>
 <div class="card"><h3 style="margin-top:0;color:var(--navy)">Admin Security</h3><div class="field"><label>اسم المستخدم</label><input id="setUser" value="${esc(db.username)}"></div><div class="field"><label>New Password</label><input id="setPass" type="password" placeholder="Leave unchanged if blank"></div><button class="primary" onclick="saveSecurity()">Update Login</button><div class="notice" style="margin-top:12px">Change the default administrator login before use. The offline app provides a local access barrier, not server-side security. Export regular backups.</div></div>
 <div class="card"><h3 style="margin-top:0;color:var(--navy)">Data Management</h3><button class="secondary" onclick="exportData()">Export Backup</button> <button class="secondary" onclick="document.getElementById('importFile').click()">Import Backup</button><input id="importFile" type="file" accept=".json" style="display:none" onchange="importData(event)"><button class="danger" onclick="resetData()">Reset All Local Data</button><p class="small" style="color:var(--muted);margin-top:12px">Keep backups because offline data is stored only on this device/browser.</p></div></div>`;
}
function saveSettings(){db.school=defaults.school;db.title=document.getElementById('setTitle').value.trim()||defaults.title;db.facilitator=document.getElementById('setFac').value.trim();db.session=document.getElementById('setSession').value.trim();db.term=document.getElementById('setTerm').value.trim();db.caMaxMark=30;db.examMaxMark=70;save();applySchoolTheme();document.getElementById('loginSchool').textContent=db.school;document.getElementById('sideSchool').textContent=db.school;document.getElementById('sideLogo').src=logoSrc();document.getElementById('loginLogo').src=logoSrc();toast('Display settings and score limits saved.');render()}
function saveLogo(){const f=document.getElementById('logoFile').files[0];if(!f)return toast('Choose a logo first.');const r=new FileReader();r.onload=()=>{db.logo=r.result;save();applySchoolTheme();document.getElementById('loginLogo').src=logoSrc();document.getElementById('sideLogo').src=logoSrc();toast('Logo saved offline. School colours updated from the logo.');render()};r.readAsDataURL(f)}
function saveSecurity(){if(currentUser?.role!=='admin')return toast('Administrator access required.');const u=document.getElementById('setUser').value.trim(),p=document.getElementById('setPass').value;if(!u)return toast('Username cannot be empty.');if(p&&p.length<6)return toast('Use a password with at least 6 characters.');if(db.accounts.some(a=>String(a.username).toLowerCase()===u.toLowerCase()))return toast('That username is already used by a teacher account.');if(!p&&u===db.username)return toast('No login change was made.');db.username=u;if(p)db.password=p;const auth={username:db.username,password:db.password};localStorage.setItem(KEY+'_auth',JSON.stringify(auth));localStorage.setItem(KEY,JSON.stringify(db));document.getElementById('setPass').value='';document.getElementById('username').value=db.username;document.getElementById('password').value='';toast('Administrator login details saved. Log out and sign in again with the new credentials.')}
async function createTeacherAccount(){if(!canManageAccounts())return toast('Authorised management access required.');const name=document.getElementById('teacherDisplayName').value.trim(),u=document.getElementById('teacherUsername').value.trim(),p=document.getElementById('teacherPassword').value,role=document.getElementById('teacherRole').value,expiryDate=document.getElementById('teacherExpiry').value;if(!name||!u||!p)return toast('Enter the full name, username and password.');if(role!=='teacher'&&currentUser.role!=='admin')return toast('Only the Administrator can create management accounts.');if(u.toLowerCase()===db.username.toLowerCase()||db.accounts.some(a=>String(a.username).toLowerCase()===u.toLowerCase()))return toast('That username already exists. Choose another.');if(p.length<6)return toast('Password must be at least 6 characters.');if(expiryDate&&new Date(expiryDate+'T23:59:59')<new Date())return toast('Expiry date must be today or a future date.');const passwordHash=await hashTeacherPassword(p);db.accounts.push({id:'account_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),username:u,displayName:name,passwordHash,role,active:true,expiryDate:expiryDate||'',createdAt:new Date().toISOString()});save();render();toast(role==='teacher'?'Teacher account created. Give the login details privately.':roleLabel(role)+' account created.');}
function toggleTeacherAccount(id){if(!canManageAccounts())return toast('Authorised management access required.');const a=db.accounts.find(x=>x.id===id);if(!a)return;if(currentUser.role!=='admin'&&a.role!=='teacher')return toast('The Principal and Examinations Officer may only change teacher access.');a.active=a.active===false?true:false;save();render();toast((a.active?'Activated ':'Deactivated ')+(a.displayName||a.username)+'.');}
function deleteTeacherAccount(id){if(!canManageAccounts())return toast('Authorised management access required.');const a=db.accounts.find(x=>x.id===id);if(!a)return;if(currentUser.role!=='admin'&&a.role!=='teacher')return toast('The Principal and Examinations Officer may only remove teacher accounts.');if(!confirm('Delete the account for '+(a.displayName||a.username)+'? This does not delete students or scores.'))return;db.accounts=db.accounts.filter(x=>x.id!==id);save();render();toast('Account deleted.');}
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='CA_Record_Backup.json';a.click();URL.revokeObjectURL(a.href);toast('Backup exported.')}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);db={...defaults,...x};save();location.reload()}catch(err){toast('Invalid backup file.')}};r.readAsText(f)}
function resetData(){if(confirm('This will delete all students, assessments, questions and settings stored on this device. Continue?')){localStorage.removeItem(KEY);localStorage.removeItem(KEY+'_logged');localStorage.removeItem(KEY+'_auth');location.reload()}}

function openModal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modal').classList.add('open')}

if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=37').catch(()=>{}));}
init();

const keys=Object.keys(T).sort((a,b)=>b.length-a.length);const translatedNodes=new WeakSet();
function tr(s){const out=String(s);for(const k of keys){if(out.trim().toLocaleLowerCase()===k.toLocaleLowerCase())return T[k];}const escRe=k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');const re=new RegExp(keys.filter(k=>k.length>3).map(escRe).join('|'),'gi');return out.replace(re,m=>{const k=keys.find(x=>x.toLocaleLowerCase()===m.toLocaleLowerCase());return k?T[k]:m;});}
function translate(){const root=document.body;if(!root)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while((n=w.nextNode())){if(!n.nodeValue||!n.nodeValue.trim()||translatedNodes.has(n))continue;const p=n.parentElement;if(!p||/^(SCRIPT|STYLE|TEXTAREA|INPUT|CODE|PRE)$/i.test(p.tagName)||p.closest('[data-no-translate]'))continue;const v=tr(n.nodeValue);if(v!==n.nodeValue){n.nodeValue=v;translatedNodes.add(n);}}root.querySelectorAll('input[placeholder],textarea[placeholder],button[title],img[alt],input[aria-label],select[aria-label]').forEach(el=>{for(const a of ['placeholder','title','alt','aria-label'])if(el.hasAttribute(a)){const old=el.getAttribute(a);if(!/[\u0600-\u06FF]/.test(old))el.setAttribute(a,tr(old));}});root.querySelectorAll('option').forEach(o=>{if(/[\u0600-\u06FF]/.test(o.textContent))return;const v=tr(o.textContent);if(v!==o.textContent)o.textContent=v;});}
let busy=false;function schedule(){if(busy)return;busy=true;requestAnimationFrame(()=>{busy=false;translate()})}
const ob=new MutationObserver(schedule);document.addEventListener('DOMContentLoaded',()=>{translate();ob.observe(document.body,{subtree:true,childList:true,characterData:true});setTimeout(translate,300);setTimeout(translate,1200)});setTimeout(()=>{if(document.body){translate();ob.observe(document.body,{subtree:true,childList:true,characterData:true})}},0);
})();

<style id="guidance-islamic-distinct-colors">:root{--navy:#702c45!important;--blue:#9b4963!important;--teal:#287c73!important;--gold:#d9b56d!important;--bg:#fbf6f0!important;--line:#e5d5c9!important;--ink:#392b32!important;--text:#392b32!important;--muted:#76646a!important}body{background:radial-gradient(circle at 10% 0%,#f4e3d7 0,transparent 34%),linear-gradient(135deg,#fbf6f0,#f2e7e0)!important}button,.primary,.success{background:linear-gradient(135deg,#702c45,#9b4963)!important;color:#fff!important} .hero{background:linear-gradient(120deg,#702c45 0%,#9b4963 58%,#287c73 100%)!important}.logo{border-color:#d9b56d!important}.tile,.card{border-color:#e5d5c9}</style><script id="guidance-arabic-number-support-ca-restored">function guidanceToLatin(v){return String(v??'').replace(/[٠-٩۰-۹]/g,c=>{const a='٠١٢٣٤٥٦٧٨٩',p='۰۱۲۳۴۵۶۷۸۹';let i=a.indexOf(c);return i>=0?String(i):String(p.indexOf(c));}).replace(/[٫٬]/g,'.').replace(/,/g,'').trim()}function guidanceIsArabic(v){return /[٠-٩۰-۹]/.test(String(v??''))}function guidanceFormatNumber(v,arabic=true){if(v===null||v===undefined||v==='')return '—';let s=String(v);return arabic?s.replace(/[0-9]/g,c=>'٠١٢٣٤٥٦٧٨٩'[+c]):s}function guidanceArabicGrade(n){return n>=70?'أ':n>=60?'ب':n>=50?'ج':n>=45?'د':n>=40?'هـ':'و'}function guidanceClampScore(raw,max){const latin=guidanceToLatin(raw).replace(/[^0-9.\-]/g,'');if(latin===''||latin==='-'||latin==='.')return null;const n=Number(latin);if(!Number.isFinite(n))return null;return Math.max(0,Math.min(Number(max)||0,n))} </script>
